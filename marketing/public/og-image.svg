<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!--
    Open Graph share image: wordmark and pitch on the Classroom palette (warm dark stage,
    apricot, teal), with the logo mark top-left. 1200x630, the standard unfurl size.
    og-image.png is rendered from this file.
  -->
  <rect width="1200" height="630" fill="#1a1512"/>

  <!-- Logo mark, top-left -->
  <g transform="translate(80, 80)">
    <rect width="100" height="100" rx="22" fill="#2e2620"/>
    <path d="M 30 32 L 58 50 L 30 68" stroke="#f3eadf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="64" y="62" width="26" height="6" rx="3" fill="#f0a35e"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="330"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="700"
        font-size="140"
        fill="#f3eadf"
        letter-spacing="-3">crow</text>

  <!-- Pitch -->
  <text x="600" y="405"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500"
        font-size="36"
        fill="#d6cbbd"
        letter-spacing="-0.5">Learn to code in a live editor.</text>
  <text x="600" y="455"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-weight="500"
        font-size="36"
        fill="#f0a35e"
        letter-spacing="-0.5">Take over the code at any moment.</text>

  <!-- Footer -->
  <text x="600" y="555"
        text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20"
        fill="#978879"
        letter-spacing="2">open source · runs in your browser</text>
</svg>

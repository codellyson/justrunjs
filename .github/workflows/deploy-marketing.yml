# Deploys the site, browser editor and API as one Cloudflare Worker (static assets + worker/index.ts).
#
# - Pushes to `master` -> apply D1 migrations, then production deploy
# - PRs -> build, typecheck and test only (previews would share the production database)
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN  — token with Workers Scripts: Edit and D1: Edit
#   CLOUDFLARE_ACCOUNT_ID — your CF account ID
#
# One-time setup (D1 database, email sender, custom domain) is in DEPLOYMENT.md.

name: deploy-marketing

on:
  push:
    branches: [master]
    paths:
      - "marketing/**"
      - ".github/workflows/deploy-marketing.yml"
  pull_request:
    paths:
      - "marketing/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build + deploy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: marketing/.nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm --filter runjs-rs-marketing build

      - name: Typecheck worker + test
        working-directory: marketing
        run: npx tsc -p worker && pnpm test && pnpm test:api

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply justrunjs --remote

      - name: Deploy worker
        if: github.event_name != 'pull_request'
        working-directory: marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
